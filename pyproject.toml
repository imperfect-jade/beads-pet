[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hatch-pet-tool"
version = "0.1.0"
description = "Python tooling for generating Flutter-ready hatch-pet sprite assets."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=10",
  "numpy>=2.0",
  "opencv-python-headless>=4.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.scripts]
hatch-pet-tool = "hatch_pet_tool.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
